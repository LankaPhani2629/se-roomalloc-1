{% extends "base.html" %}

{% block title %}400 - Bad Request{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="display-1 fw-bold text-warning mb-3">400</div>
        <h3 class="fw-bold mb-2">Invalid or Malformed Request</h3>
        <p class="text-muted mb-4">
            The server could not understand the request due to invalid parameters or malformed data.
        </p>
        <a href="{% url 'home' %}" class="btn btn-primary px-4 fw-semibold shadow-sm">
            <i class="bi bi-house-door me-1"></i> Return Home
        </a>
    </div>
</div>
{% endblock %}
