{% extends "base.html" %}

{% block title %}Password Reset Complete - Campus Residences{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 text-center p-4">
            <div class="mb-3 text-success">
                <i class="bi bi-shield-check fs-1"></i>
            </div>
            <h4 class="fw-bold mb-2">Password Reset Successful!</h4>
            <p class="text-muted small mb-4">
                Your password has been changed successfully. You may now sign in with your new password.
            </p>
            <div>
                <a href="{% url 'login' %}" class="btn btn-primary fw-semibold px-4 shadow-sm">
                    Sign In Now
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
