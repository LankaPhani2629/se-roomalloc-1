{% extends "base.html" %}

{% block title %}Reset Password - Campus Residences{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 border-bottom text-center">
                <i class="bi bi-shield-lock text-primary fs-2 d-block mb-1"></i>
                <h4 class="fw-bold mb-0">Reset Password</h4>
                <p class="text-muted small mb-0">Enter your registered email address to receive password reset instructions.</p>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="name@college.edu" required autocomplete="email">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-semibold shadow-sm mb-3">
                        <i class="bi bi-send me-1"></i> Send Password Reset Link
                    </button>
                    <div class="text-center">
                        <a href="{% url 'login' %}" class="small text-decoration-none text-muted">
                            <i class="bi bi-arrow-left me-1"></i> Back to Sign In
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
