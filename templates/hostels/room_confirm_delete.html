{% extends "base.html" %}

{% block title %}Delete Room - Hostel Admin{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="card shadow p-4 text-center">
            <div class="rounded-circle bg-danger-subtle text-danger d-inline-flex p-3 mx-auto mb-3">
                <i class="bi bi-trash fs-2"></i>
            </div>
            <h4 class="fw-bold">Delete Room {{ room.room_no }}?</h4>
            <p class="text-muted">
                Are you sure you want to permanently delete Room <strong>{{ room.room_no }}</strong> in <strong>{{ room.hostel.name }}</strong>?
            </p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2 mt-4">
                    <a href="{% url 'room_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger fw-bold px-4">Yes, Delete Room</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
