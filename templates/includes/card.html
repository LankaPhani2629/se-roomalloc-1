{# Reusable Card Wrapper Component #}
{# Parameters: title, subtitle, icon, extra_header_content #}
<div class="card card-hover-lift shadow-sm mb-4">
  {% if title %}
    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
      <div class="d-flex align-items-center gap-2">
        {% if icon %}<i class="bi bi-{{ icon }} text-coral fs-5"></i>{% endif %}
        <div>
          <h6 class="mb-0 fw-bold font-heading text-dark">{{ title }}</h6>
          {% if subtitle %}<small class="text-muted">{{ subtitle }}</small>{% endif %}
        </div>
      </div>
      {% if extra_header_content %}{{ extra_header_content }}{% endif %}
    </div>
  {% endif %}
  <div class="card-body">
    {{ content }}
  </div>
</div>
