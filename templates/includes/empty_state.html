{# Reusable Empty State Component #}
{# Parameters: icon, title, description, action_url, action_text #}
<div class="empty-state">
  <div class="empty-state-icon">
    <i class="bi bi-{{ icon|default:'folder-x' }}"></i>
  </div>
  <h5 class="fw-bold text-dark font-heading mb-2">{{ title|default:'No Records Found' }}</h5>
  <p class="text-muted small mx-auto mb-3" style="max-width: 420px;">
    {{ description|default:'There are no items matching this criteria at the moment.' }}
  </p>
  {% if action_url and action_text %}
    <a href="{{ action_url }}" class="btn btn-primary btn-sm">
      {{ action_text }}
    </a>
  {% endif %}
</div>
