{% extends "base.html" %}

{% block title %}Meal Feedback & Rating - Student Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                <div>
                    <h4 class="fw-bold mb-0">
                        <i class="bi bi-star-half text-warning me-2"></i>Rate Mess Meal
                    </h4>
                    <p class="text-muted small mb-0">Help improve hostel food quality and hygiene with your rating and reviews.</p>
                </div>
                <a href="{% url 'mess_menu' %}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Back to Menu
                </a>
            </div>

            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Which meal are you rating? <span class="text-danger">*</span></label>
                        <select name="meal" class="form-select" required>
                            <option value="">-- Select Meal --</option>
                            {% for code, label in meal_choices %}
                                <option value="{{ code }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Food Quality Rating (1 to 5 Stars) <span class="text-danger">*</span></label>
                        <select name="rating" class="form-select" required>
                            <option value="5">⭐⭐⭐⭐⭐ 5 Stars - Delicious & fresh</option>
                            <option value="4">⭐⭐⭐⭐ 4 Stars - Good taste and hygienic</option>
                            <option value="3" selected>⭐⭐⭐ 3 Stars - Average / Acceptable</option>
                            <option value="2">⭐⭐ 2 Stars - Substandard / Low quality</option>
                            <option value="1">⭐ 1 Star - Poor quality / Unacceptable</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Detailed Comments or Suggestions</label>
                        <textarea name="comments" rows="3" class="form-control" placeholder="Share your suggestions on taste, seasoning, temperature, cleanliness, or portions..."></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'mess_menu' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-warning px-4 fw-semibold shadow-sm text-dark">
                            <i class="bi bi-send-check me-1"></i> Submit Feedback
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
