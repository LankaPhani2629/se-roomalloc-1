{% extends "base.html" %}

{% block title %}Publish Hostel Mess Menu - Campus Administration{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                <div>
                    <h4 class="fw-bold mb-0">
                        <i class="bi bi-calendar-plus text-primary me-2"></i>Publish Mess Menu
                    </h4>
                    <p class="text-muted small mb-0">Publish or update the scheduled meal menu for hostel residents.</p>
                </div>
                <a href="{% url 'mess_menu' %}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Back to Menu
                </a>
            </div>

            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Hostel Block <span class="text-danger">*</span></label>
                        <select name="hostel" class="form-select" required>
                            <option value="">-- Select Hostel Block --</option>
                            {% for hostel in hostels %}
                                <option value="{{ hostel.pk }}">{{ hostel.name }} ({{ hostel.get_hostel_type_display }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Date <span class="text-danger">*</span></label>
                            <input type="date" name="date" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Meal Session <span class="text-danger">*</span></label>
                            <select name="meal" class="form-select" required>
                                <option value="">-- Select Meal --</option>
                                {% for code, label in meal_choices %}
                                    <option value="{{ code }}">{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Menu Items & Dishes <span class="text-danger">*</span></label>
                        <textarea name="items" rows="4" class="form-control" placeholder="e.g. Masala Dosa, Sambhar, Coconut Chutney, Filter Coffee / Tea" required></textarea>
                        <div class="form-text small">Enter dishes separated by commas.</div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'mess_menu' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold shadow-sm">
                            <i class="bi bi-check2-circle me-1"></i> Publish Menu
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
